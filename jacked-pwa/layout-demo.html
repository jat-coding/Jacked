<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Jacked Layout Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#000;--bg2:#16161c;--bg3:#1e1e26;--bg4:#292932;--border:#26262f;--border2:#363642;--accent:#20d3c2;--on-accent:#04140a;--orange:#ff9f4d;--blue:#5aa9ff;--purple:#b07cff;--gold:#ffd700;--green:#3ddc97;--muted:#70707f;--text:#f3f3f8;--text2:#a4a4b4;--fh:'Barlow Condensed',sans-serif;--fb:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0f;color:var(--text);font-family:var(--fb);padding-inline:16px;padding-block:20px 40px}
.top{max-width:1200px;margin:0 auto 18px}
h1{font-family:var(--fh);font-size:30px;font-weight:800;letter-spacing:.5px}
.sub{color:var(--text2);font-size:14px;margin-top:4px;max-width:60ch;line-height:1.45}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tab{font:600 14px var(--fb);padding:10px 16px;border-radius:12px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
.tab[aria-pressed=true]{background:var(--text);color:#000;border-color:var(--text)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{margin-top:14px;color:var(--text2);font-size:13px;line-height:1.5;max-width:70ch;padding:12px 14px;border-left:3px solid var(--border2);background:var(--bg2)}
.strip{display:flex;gap:22px;overflow-x:auto;padding:8px 2px 24px;max-width:1200px;margin:0 auto;scroll-snap-type:x proximity}
.phone{flex:0 0 340px;scroll-snap-align:start}
.plabel{font:700 12px var(--fb);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.screen{background:#000;border:1px solid var(--border2);border-radius:34px;overflow:hidden;height:720px;display:flex;flex-direction:column;position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;flex:0 0 auto}
.pt{font-family:var(--fh);font-size:30px;font-weight:800;letter-spacing:.5px}
.hbtn{font:600 13px var(--fb);padding:8px 14px;border-radius:12px;border:1px solid var(--border2);background:transparent;color:var(--text2)}
.body{flex:1;overflow-y:auto;padding:6px 14px 20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.nav{flex:0 0 auto;display:flex;justify-content:space-around;padding:10px 6px 16px;border-top:1px solid var(--border);background:#000}
.nav span{font:600 10px var(--fb);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav span.on{color:var(--accent)}
.nav i{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:block}
/* content atoms */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile .n{font-family:var(--fh);font-size:26px;font-weight:800;line-height:1}
.tile .l{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--fh);color:#04140a;flex:0 0 auto}
.rt{font-weight:600;font-size:14px}.rs{font-size:12px;color:var(--muted);margin-top:2px}
.rv{margin-left:auto;font-family:var(--fh);font-weight:800;font-size:18px;color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{white-space:nowrap;padding:6px 13px;border-radius:20px;border:1px solid var(--border2);font-size:11px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cta{display:block;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;padding:14px;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px;color:var(--text2)}
.cal b{font-weight:600;font-size:10px;color:var(--muted)}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px}
.cal .w{background:var(--accent);color:var(--on-accent);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.spark{width:100%;height:70px;display:block}
.thumb{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.search{border:1px solid var(--border2);border-radius:12px;padding:11px 14px;color:var(--muted);font-size:14px}

/* ===== B: what the other pages look like now: small grey caps titles, separate grey blocks ===== */
.v-b .sec{margin-bottom:16px}
.v-b .st{font:700 14px var(--fh);letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.v-b .tile{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.v-b .row{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.v-b .blk{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:14px}
.v-b .hbtn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v-b .x{display:none}
/* ===== A: every page in the Metrics look: big accent-bar titles, one card per section, wide gaps ===== */
.v-a .body{display:flex;flex-direction:column;gap:26px}
.v-a .sec{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 10px 28px -12px rgba(0,0,0,.6)}
.v-a .sech{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.v-a .st{font-family:var(--fh);font-size:22px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;line-height:1.15;padding-left:12px;border-left:4px solid var(--accent)}
.v-a .x{font-size:13px;color:var(--text2);border:1px solid var(--border2);border-radius:9px;padding:3px 9px}
.v-a .tile{text-align:left;padding:2px 0}
.v-a .tiles{gap:10px}
.v-a .row{padding:11px 0;border-bottom:1px solid var(--border)}
.v-a .row:last-child{border-bottom:0}
.v-a .blk{padding:0}
/* ===== C: hybrid — Metrics spacing + big titles, but lighter: no accent bar, inset stat wells, hairline rows, meta on the title line ===== */
.v-c .body{display:flex;flex-direction:column;gap:22px}
.v-c .sec{background:linear-gradient(180deg,#1a1a21,#131318);border-radius:20px;padding:18px 18px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 30px -14px rgba(0,0,0,.8)}
.v-c .sech{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.v-c .st{font-family:var(--fh);font-size:24px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text);line-height:1}
.v-c .x{font-size:12px;font-weight:600;color:var(--muted)}
.v-c .tiles{gap:8px;padding-bottom:10px}
.v-c .tile{background:#0d0d11;border-radius:14px;padding:12px 10px;text-align:left}
.v-c .tile .n{color:var(--text)}
.v-c .row{padding:12px 0;border-top:1px solid #23232b}
.v-c .row:first-of-type{border-top:0}
.v-c .blk{padding:0 0 10px}
.v-c .cta{margin-bottom:10px}
.v-c .chips{padding-bottom:10px}
.v-c .cal{padding-bottom:10px}
@media (max-width:420px){.phone{flex-basis:calc(100vw - 40px)}}
</style>
</head><body>

<div class="top">
  <h1>Jacked — page layouts</h1>
  <p class="sub">Same five pages, three treatments. Swipe sideways to see every page. Content is sample data.</p>
  <div class="tabs" role="group" aria-label="Layout">
    <button class="tab" data-v="a" aria-pressed="true">1 · All pages like Metrics</button>
    <button class="tab" data-v="b" aria-pressed="false">2 · As the other pages are now</button>
    <button class="tab" data-v="c" aria-pressed="false">3 · New hybrid</button>
  </div>
  <div class="note" id="note"></div>
</div>
<div class="strip" id="strip"></div>

<script>
const AV=['#5aa9ff','#3ddc97','#ff9f4d','#b07cff'];
const av=(t,i)=>`<div class="av" style="background:${AV[i%4]}">${t}</div>`;
const sec=(t,x,h)=>`<section class="sec"><div class="sech"><div class="st">${t}</div>${x?`<span class="x">${x}</span>`:''}</div>${h}</section>`;
const tiles=a=>`<div class="tiles">${a.map(([n,l])=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>`;
const row=(l,t,s,v)=>`<div class="row">${l}<div><div class="rt">${t}</div><div class="rs">${s}</div></div>${v?`<div class="rv">${v}</div>`:''}</div>`;
const thumb=c=>`<div class="thumb" style="background:${c}22;color:${c}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg></div>`;
const cal=()=>{let h=['S','M','T','W','T','F','S'].map(d=>`<b>${d}</b>`).join('');h+='<span></span><span></span>';const w=[2,3,5,8,9,11,12,15,16,18,19,22];for(let d=1;d<=30;d++)h+=`<span class="${w.includes(d)?'w':''}">${d}</span>`;return `<div class="cal">${h}</div>`};
const pages={
Home:(v)=>[
 sec('This month','',tiles([['12','Workouts'],['118k','lb volume'],['9','PRs']])),
 sec('Streak','',row(`<div class="thumb" style="background:#ff9f4d22;color:#ff9f4d">🔥</div>`.replace('🔥','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>'),'4 day streak','Best: 11 days')),
 sec('September','',cal()),
 `<div class="sec blk" style="${v==='b'?'':'padding:0;background:none;border:0;box-shadow:none'}"><a class="cta">Start Workout</a></div>`,
 sec('Recent workouts','See all',row(thumb('#5aa9ff'),'Push Day','Today · 6 exercises','14.2k')+row(thumb('#3ddc97'),'Pull Day','Sat · 5 exercises','11.8k')+row(thumb('#20d3c2'),'Legs','Thu · 7 exercises','19.4k'))],
Routines:(v)=>[
 `<div class="sec blk" style="${v==='b'?'':'padding:0;background:none;border:0;box-shadow:none'}"><a class="cta" style="background:transparent;color:var(--text2);border:1px solid var(--border2)">Start Empty Workout</a></div>`,
 sec('Featured','',`<div class="chips"><span class="chip on">Push/Pull/Legs</span><span class="chip">5×5</span><span class="chip">Upper/Lower</span></div>`),
 sec('My routines','3',row(thumb('#5aa9ff'),'Push Day','Bench, OHP, Dips +3','')+row(thumb('#3ddc97'),'Pull Day','Rows, Pull-ups +3','')+row(thumb('#20d3c2'),'Legs','Squat, RDL +4',''))],
Library:(v)=>[
 `<div class="sec blk" style="${v==='b'?'':'padding:0;background:none;border:0;box-shadow:none'}"><div class="search">Search exercises…</div><div class="chips" style="margin-top:10px"><span class="chip on">All</span><span class="chip">Chest</span><span class="chip">Back</span><span class="chip">Legs</span><span class="chip">Arms</span></div></div>`,
 sec('Chest','24',row(thumb('#5aa9ff'),'Barbell Bench Press','Chest · Barbell','')+row(thumb('#5aa9ff'),'Incline Dumbbell Press','Chest · Dumbbell','')+row(thumb('#5aa9ff'),'Cable Fly','Chest · Cable','')),
 sec('Back','31',row(thumb('#3ddc97'),'Pull-Up','Lats · Bodyweight','')+row(thumb('#3ddc97'),'Barbell Row','Back · Barbell',''))],
Metrics:(v)=>[
 sec('Body weight','✕',`<div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:var(--fh);font-size:36px;font-weight:800">184.2</span><span style="color:var(--muted);font-size:13px">lb · −1.8 this month</span></div><svg class="spark" viewBox="0 0 300 70" fill="none"><path d="M0 20 L50 26 L100 24 L150 38 L200 34 L250 48 L300 52" stroke="#20d3c2" stroke-width="2.5" stroke-linejoin="round"/><circle cx="300" cy="52" r="4" fill="#20d3c2"/></svg>`),
 sec('Top PR','✕',row(`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>`,'Bench Press','Sep 14','225 × 5')),
 sec('Badges','✕',row(thumb('#5aa9ff'),'Bench-Maxing','Gold','')+row(thumb('#ff9f4d'),'Shoulder-Maxing','Silver',''))],
Friends:(v)=>[
 sec('Compare','',`<div class="chips" style="flex-wrap:wrap"><span class="chip on">Weight</span><span class="chip">PRs</span><span class="chip">Sessions</span><span class="chip">Streak</span></div><div style="height:12px"></div>`+row(av('MK',0),'Marcus K.','Close buddy','48.2k')+row(av('AL',1),'Ana L.','Close buddy','41.7k')),
 sec('You','',row(av('JA',2),'Jacosta (You)','@jacosta · 42 workouts','')),
 sec('Friends','3',row(av('MK',0),'Marcus K.','@marcusk · 61 workouts','')+row(av('AL',1),'Ana L.','@anal · 38 workouts','')+row(av('DR',3),'Dre R.','@dre · 27 workouts',''))]
};
const btn={Home:'',Routines:'+ New',Library:'+ Custom',Metrics:'Reorder',Friends:'+ Friend'};
const navOn={Home:0,Routines:1,Library:2,Metrics:3,Friends:4};
const navL=['Home','Routines','Library','Metrics','Friends'];
const notes={a:'Every page adopts the Metrics look: big titles with the teal bar, each section in its own card, wide gaps, flat rows with hairlines instead of grey tiles. Consistent, but the teal bar repeated on every card gets heavy.',
b:'How the non-Metrics pages look today: small grey caps headers, every item its own grey block or tile, tight spacing. Shown for comparison.',
c:'New hybrid: Metrics-size titles and generous spacing, without the accent bar. Cards get a soft top highlight, stats sit in inset dark wells, rows are hairline-divided, and teal is kept for the one primary action and selected state. Header buttons are grey.'};
function render(v){
  document.getElementById('note').textContent=notes[v];
  document.getElementById('strip').innerHTML=Object.keys(pages).map(p=>`<div class="phone"><div class="plabel">${p}</div><div class="screen v-${v}"><div class="hdr"><div class="pt">${p==='Home'?'JACKED<span style="color:var(--accent)">.</span>':p}</div>${btn[p]?`<span class="hbtn">${btn[p]}</span>`:''}</div><div class="body">${pages[p](v).join('')}</div><div class="nav">${navL.map((n,i)=>`<span class="${i===navOn[p]?'on':''}"><i></i>${n}</span>`).join('')}</div></div></div>`).join('');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===t));render(t.dataset.v)});
render('a');
</script>
</body></html>
