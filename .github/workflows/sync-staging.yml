# Mirrors main to the `staging` branch on every push. Netlify builds `staging` as a branch deploy
# (staging--jacked-trainer.netlify.app) so changes can be verified before anything goes live.
# Production publishing is locked in Netlify; going live is a manual step.
name: sync-staging
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: sync-staging
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/staging
