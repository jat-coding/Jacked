# Mirrors main to the `staging` branch. Netlify builds `staging` as a branch deploy
# (staging--jacked-trainer.netlify.app) so changes can be verified before anything goes live.
# Production publishing is locked in Netlify; going live is a manual step.
#
# Manual trigger only (2026-10-10, Mr. Roni: pushes to main were auto-spinning a second Netlify
# branch deploy on every commit, burning credits on top of the stop_builds leak). Run it by hand
# from the Actions tab when you actually want staging to pick up main.
#
# Skipped when: staging is already AHEAD of main (work is pushed to staging first for review).
# A plain fast-forward push would be rejected then, and the run used to fail and email everyone.
# Staging is never force-pushed.
name: sync-staging
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: sync-staging
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward staging to main (skip if staging is ahead)
        run: |
          if ! git ls-remote --exit-code --heads origin staging >/dev/null 2>&1; then
            git push origin HEAD:refs/heads/staging
          elif git merge-base --is-ancestor origin/staging HEAD; then
            git push origin HEAD:refs/heads/staging
          else
            echo "staging is ahead of (or diverged from) main; skipping sync"
          fi
